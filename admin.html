<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Rider TV Control</title>
    <style>
        :root {
            --bg-primary: #070a13;
            --bg-secondary: #0f1526;
            --accent: #ff007f;
            --accent-gradient: linear-gradient(135deg, #ff007f, #7928ca);
            --accent-danger: #ff4b4b;
            --text-main: #ffffff;
            --text-muted: #7e8da6;
            --border-color: #1e2942;
            --card-bg: #172037;
            --input-bg: #0b101d;
            --vip-color: #ffb700;
            --yt-color: #ff0000;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            background: var(--accent-gradient);
            width: 14px;
            height: 26px;
            border-radius: 4px;
            transform: skewX(-15deg);
        }

        .logo-text {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-badge {
            background-color: rgba(255, 0, 127, 0.15);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid rgba(255, 0, 127, 0.3);
        }

        .admin-container {
            max-width: 1600px;
            width: 100%;
            margin: 25px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 25px;
            flex: 1;
        }

        @media (max-width: 1100px) {
            .admin-container {
                grid-template-columns: 1fr;
            }
        }

        .card-panel {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-title {
            font-size: 17px;
            font-weight: 700;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 13.5px;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-gradient);
            border: none;
            color: #ffffff;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-clear {
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 5px;
            transition: all 0.2s;
        }

        .btn-clear:hover {
            border-color: var(--accent-danger);
            color: var(--accent-danger);
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: var(--card-bg);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13.5px;
            vertical-align: middle;
        }

        .channel-row:hover {
            background-color: rgba(255, 255, 255, 0.01);
        }

        .logo-preview-cell {
            width: 40px;
            height: 40px;
            background-color: var(--card-bg);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .logo-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        .fallback-avatar {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .type-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-movies { background-color: rgba(255, 0, 127, 0.15); color: var(--accent); }
        .badge-premium { background-color: rgba(121, 40, 202, 0.15); color: #b882ff; }
        .badge-youtube { background-color: rgba(255, 0, 0, 0.15); color: var(--yt-color); }

        .url-text {
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-muted);
            font-family: monospace;
            font-size: 11px;
        }

        .actions-cell {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete {
            border-color: rgba(255, 75, 75, 0.3);
            color: var(--accent-danger);
        }

        .btn-delete:hover {
            background-color: rgba(255, 75, 75, 0.15);
        }

        .counter-badge {
            background-color: var(--card-bg);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--accent);
            font-weight: 700;
        }

        .note-box {
            background-color: rgba(255,0,127,0.05);
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed var(--border-color);
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-badge"></div>
            <div class="logo-text">Rider Control</div>
            <div class="admin-badge">FIRESTORE LIVE SYSTEM</div>
        </div>
        <div style="font-size: 13px; color: var(--text-muted);">
            Gestión en tiempo real activa | Soporta M3U8 y YouTube Live
        </div>
    </header>

    <main class="admin-container">
        <div style="display: flex; flex-direction: column; gap: 20px;">
            
            <section class="card-panel">
                <div class="panel-title">
                    <span>🔌 Importar Lista M3U</span>
                </div>
                <div class="form-group">
                    <label for="m3u-input">Pega tu lista (.m3u / .m3u8)</label>
                    <textarea id="m3u-input" placeholder="#EXTM3U&#10;#EXTINF:-1,Canal&#10;http://...&#10;#EXTINF:-1,YouTube&#10;https://www.youtube.com/watch?v=..."></textarea>
                </div>
                <button class="btn-submit" onclick="importM3UList()">⚡ Procesar e Importar</button>
            </section>

            <section class="card-panel">
                <div class="panel-title">✍️ Agregar Canal Manual</div>
                <form id="channel-form" onsubmit="handleFormSubmit(event)">
                    <div class="form-group">
                        <label for="stream-type">Categoría</label>
                        <select id="stream-type">
                            <option value="movies">🎬 Películas & Series</option>
                            <option value="premium">💎 Canales Premium</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="stream-name">Nombre del Canal</label>
                        <input type="text" id="stream-name" placeholder="Ej. Televisa en Vivo" required>
                    </div>

                    <div class="form-group">
                        <label for="stream-subtitle">Descripción</label>
                        <input type="text" id="stream-subtitle" placeholder="Ej. Transmisión oficial 24/7">
                    </div>

                    <div class="form-group">
                        <label for="stream-logo">URL del Logo</label>
                        <input type="url" id="stream-logo" placeholder="https://...">
                    </div>

                    <div class="note-box">
                        <strong>🔓 Todos los canales son gratuitos</strong><br>
                        ✅ Soporta: .m3u8, .ts y enlaces de YouTube en vivo
                    </div>

                    <div class="form-group">
                        <label for="stream-url-1">Enlace Principal</label>
                        <input type="url" id="stream-url-1" placeholder="http://... o https://youtube.com/watch?v=..." required>
                    </div>

                    <div class="form-group">
                        <label for="stream-url-2">Enlace Alternativo (Opcional)</label>
                        <input type="url" id="stream-url-2" placeholder="http://...">
                    </div>

                    <button type="submit" class="btn-submit">💾 Guardar Canal</button>
                </form>
            </section>
        </div>

        <section class="card-panel">
            <div class="panel-title">
                <span>Canales en Firestore</span>
                <span class="counter-badge" id="item-count">0 Canales</span>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Logo</th>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Enlace</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="channels-table-body"></tbody>
                </table>
            </div>
            
            <button class="btn-clear" onclick="clearAllChannels()">⚠️ Borrar Todos</button>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCBZki64bsD7E7eCx19EAFPjlpDvngUf7o",
            authDomain: "rider-tv.firebaseapp.com",
            projectId: "rider-tv",
            storageBucket: "rider-tv.firebasestorage.app",
            messagingSenderId: "170739641097",
            appId: "1:170739641097:web:7bda16abe08ff26516c1d8",
            measurementId: "G-8WW2ZBC9DY"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const channelsCollection = db.collection('arena_streams');

        channelsCollection.onSnapshot(snapshot => {
            const canales = {};
            snapshot.forEach(doc => canales[doc.id] = doc.data());
            renderTable(canales);
        }, err => console.error("Error:", err));

        function esEnlaceYouTube(url) {
            return /(youtube\.com|youtu\.be)/i.test(url || '');
        }

        function renderTable(canales) {
            const tbody = document.getElementById('channels-table-body');
            document.getElementById('item-count').textContent = `${Object.keys(canales).length} Canales`;
            tbody.innerHTML = '';

            if (Object.keys(canales).length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:30px;">Sin canales registrados aún</td></tr>`;
                return;
            }

            Object.entries(canales).forEach(([id, canal]) => {
                const logo = canal.logo ? `<img src="${canal.logo}" class="logo-img" onerror="this.outerHTML='<div class=fallback-avatar>${(canal.name||'??').slice(0,2)}</div>'">` : `<div class="fallback-avatar">${(canal.name||'??').slice(0,2)}</div>`;
                const tipo = canal.type === 'movies' ? 'Cine' : 'Premium';
                const badge = esEnlaceYouTube(canal.mirrors?.[0]) ? 'badge-youtube' : `badge-${canal.type}`;
                const urlVista = canal.mirrors?.[0] || 'Sin enlace';

                tbody.innerHTML += `
                <tr class="channel-row">
                    <td><div class="logo-preview-cell">${logo}</div></td>
                    <td><strong>${canal.name}</strong><br><small style="color:var(--text-muted);font-size:11px;">${canal.subtitle||''}</small></td>
                    <td><span class="type-badge ${badge}">${esEnlaceYouTube(canal.mirrors?.[0]) ? 'YouTube' : tipo}</span></td>
                    <td><div class="url-text" title="${urlVista}">${urlVista}</div></td>
                    <td><button class="btn-action btn-delete" onclick="borrarCanal('${id}')">Eliminar</button></td>
                </tr>`;
            });
        }

        function normalizarEnlace(url) {
            if (!url) return url;
            // Convierte enlaces normales de YouTube al formato embebido compatible
            if (url.includes('watch?v=')) {
                const id = url.split('v=')[1]?.split('&')[0];
                return `https://www.youtube.com/embed/${id}`;
            }
            if (url.includes('youtu.be/')) {
                const id = url.split('youtu.be/')[1]?.split('?')[0];
                return `https://www.youtube.com/embed/${id}`;
            }
            return url;
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const url1 = normalizarEnlace(document.getElementById('stream-url-1').value.trim());
            const url2 = normalizarEnlace(document.getElementById('stream-url-2').value.trim());
            const mirrors = url2 ? [url1, url2] : [url1];

            const nuevo = {
                type: document.getElementById('stream-type').value,
                name: document.getElementById('stream-name').value.trim(),
                subtitle: document.getElementById('stream-subtitle').value.trim() || 'Transmisión en vivo',
                logo: document.getElementById('stream-logo').value.trim(),
                isVip: false,
                mirrors: mirrors
            };

            channelsCollection.add(nuevo)
                .then(() => {
                    document.getElementById('channel-form').reset();
                    alert('✅ Canal guardado y sincronizado');
                })
                .catch(err => {
                    console.error(err);
                    alert('❌ Error al guardar: revisa permisos de Firestore');
                });
        }

        function importM3UList() {
            const texto = document.getElementById('m3u-input').value;
            if (!texto.trim()) return alert('Pega primero tu lista M3U');

            const lineas = texto.split('\n');
            const lote = db.batch();
            let contador = 0;
            let datos = null;

            lineas.forEach(linea => {
                const limpia = linea.trim();
                if (limpia.startsWith('#EXTINF:')) {
                    const nom = limpia.split(',').pop()?.trim() || 'Canal importado';
                    const logo = limpia.match(/tvg-logo="([^"]+)"/i)?.[1] || '';
                    const tipo = /cine|pelicula|movie/i.test(nom) ? 'movies' : 'premium';
                    datos = { name: nom, logo, type: tipo };
                } else if (limpia && !limpia.startsWith('#') && datos) {
                    const url = normalizarEnlace(limpia);
                    const ref = channelsCollection.doc();
                    lote.set(ref, {
                        type: datos.type,
                        name: datos.name,
                        subtitle: 'Importado automáticamente',
                        logo: datos.logo,
                        isVip: false,
                        mirrors: [url]
                    });
                    contador++;
                    datos = null;
                }
            });

            if (contador === 0) return alert('No se encontraron canales válidos');
            lote.commit().then(() => {
                document.getElementById('m3u-input').value = '';
                alert(`✅ Se importaron ${contador} canales correctamente`);
            }).catch(err => alert('Error al importar: ' + err.message));
        }

        function borrarCanal(id) {
            if (confirm('¿Eliminar este canal? Se quitará de todos los dispositivos')) {
                channelsCollection.doc(id).delete().catch(err => alert(err.message));
            }
        }

        function clearAllChannels() {
            if (!confirm('⚠️ ¿Borrar TODOS los canales? Esta acción no se deshace')) return;
            channelsCollection.get().then(res => {
                const lote = db.batch();
                res.forEach(doc => lote.delete(doc.ref));
                return lote.commit();
            }).then(() => alert('✅ Colección vaciada')).catch(err => alert(err.message));
        }
    </script>
</body>
</html>
