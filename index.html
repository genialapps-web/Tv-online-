<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider TV | Tus Canales</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <style>
        :root {
            --bg-primary: #070a13;
            --bg-secondary: #0f1526;
            --accent: #ff007f;
            --accent-gradient: linear-gradient(135deg, #ff007f, #7928ca);
            --text-main: #ffffff;
            --text-muted: #7e8da6;
            --border-color: #1e2942;
            --card-bg: #172037;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            background: var(--accent-gradient);
            width: 14px;
            height: 26px;
            border-radius: 4px;
            transform: skewX(-15deg);
        }

        .logo-text {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .view-toggle {
            display: flex;
            background-color: var(--bg-primary);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .view-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .view-btn.active {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid rgba(255, 0, 127, 0.3);
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        .stream-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            aspect-ratio: 16 / 9;
        }

        .native-player {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background-color: #000;
        }

        .embed-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .stream-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background-color: var(--bg-secondary);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .mirror-selectors { display: flex; gap: 10px; }
        
        .mirror-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .mirror-btn.active {
            border-color: var(--accent);
            color: var(--text-main);
            background-color: rgba(255, 0, 127, 0.1);
        }

        .sidebar-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: calc(100vh - 120px);
        }

        .tabs-container {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            gap: 15px;
        }

        .tab-link {
            background: none; border: none;
            color: var(--text-muted); padding: 12px 5px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            position: relative;
        }

        .tab-link.active { color: var(--text-main); }
        
        .tab-link.active::after {
            content: ''; position: absolute; bottom: -2px; left: 0;
            width: 100%; height: 2px; background-color: var(--accent);
        }

        .lists-wrapper { overflow-y: auto; flex: 1; scroll-behavior: smooth; }
        .list-content { display: none; flex-direction: column; gap: 10px; padding-bottom: 10px; }
        .list-content.active { display: flex; }

        .channel-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .item-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .item-card:hover, .item-card.active {
            border-color: var(--accent);
            background-color: var(--card-bg);
        }

        .channel-logo-wrapper {
            width: 45px; height: 45px;
            background-color: var(--bg-primary);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .channel-logo { max-width: 100%; max-height: 100%; object-fit: cover; }
        
        .card-details { flex: 1; min-width: 0; }
        .channel-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-category { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .free-badge {
            background-color: rgba(0, 255, 127, 0.15);
            color: #00ff7f;
            border: 1px solid rgba(0, 255, 127, 0.4);
            padding: 3px 8px; border-radius: 4px;
            font-size: 10px; font-weight: 700;
            flex-shrink: 0;
        }

        body.view-tv-mode { background-color: #020408; }
        body.view-tv-mode header { display: none; }
        body.view-tv-mode .main-container { max-width: 100vw; height: 100vh; padding: 0; gap: 0; }
        body.view-tv-mode .stream-section { flex: 3; gap: 0; }
        body.view-tv-mode .player-wrapper { border-radius: 0; border: none; height: 100vh; aspect-ratio: auto; }
        body.view-tv-mode .sidebar-section { flex: 1; background-color: var(--bg-secondary); border-left: 1px solid var(--border-color); padding: 20px; max-height: 100vh; }

        .exit-tv-floater {
            display: none; position: fixed; top: 20px; right: 20px; z-index: 200;
            background-color: rgba(0, 0, 0, 0.8); border: 1px solid var(--accent); color: var(--accent);
            padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
        }
        body.view-tv-mode .exit-tv-floater { display: block; }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; padding: 15px; }
            .sidebar-section { max-height: 45vh; }
            .logo-text { font-size: 18px; }
            .stream-controls { font-size: 12px; }
        }
    </style>
</head>
<body>

    <button class="exit-tv-floater" onclick="switchView('mobile')">📺 Salir Modo TV</button>

    <header>
        <div class="logo-area">
            <div class="logo-badge"></div>
            <div class="logo-text">Rider TV</div>
        </div>
        <div class="view-toggle">
            <button id="btn-mobile" class="view-btn active" onclick="switchView('mobile')">📱 Móvil / Web</button>
            <button id="btn-tv" class="view-btn" onclick="switchView('tv')">📺 Vista TV</button>
        </div>
    </header>

    <main class="main-container">
        <section class="stream-section">
            <div class="player-wrapper">
                <video id="live-player" class="native-player" controls muted playsinline poster="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1200&auto=format&fit=crop"></video>
                <iframe id="embed-player" class="embed-frame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <div class="stream-controls">
                <div>
                    <span id="current-stream-title" style="font-weight:600; font-size:14px;">Seleccione un canal de la lista</span>
                </div>
                <div class="mirror-selectors">
                    <button id="mirror-1" class="mirror-btn active" onclick="changeMirror(1)">Señal Principal</button>
                    <button id="mirror-2" class="mirror-btn" onclick="changeMirror(2)">Señal Espejo</button>
                </div>
            </div>
        </section>

        <section class="sidebar-section">
            <div class="tabs-container">
                <button id="tab-movies" class="tab-link active" onclick="window.switchTab('movies')">🎬 Películas & Series</button>
                <button id="tab-premium" class="tab-link" onclick="window.switchTab('premium')">💎 Canales Premium</button>
            </div>

            <div class="lists-wrapper">
                <div id="content-movies" class="list-content active">
                    <div class="channel-grid" id="movies-container"></div>
                </div>
                <div id="content-premium" class="list-content">
                    <div class="channel-grid" id="premium-container"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCBZki64bsD7E7eCx19EAFPjlpDvngUf7o",
            authDomain: "rider-tv.firebaseapp.com",
            projectId: "rider-tv",
            storageBucket: "rider-tv.firebasestorage.app",
            messagingSenderId: "170739641097",
            appId: "1:170739641097:web:7bda16abe08ff26516c1d8",
            measurementId: "G-8WW2ZBC9DY"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const channelsCollection = db.collection('arena_streams');

        channelsCollection.onSnapshot((snapshot) => {
            let channelsList = [];
            snapshot.forEach((doc) => channelsList.push({ id: doc.id, ...doc.data() }));
            window.activeChannels = channelsList;
            window.renderChannels();
            if (channelsList.length > 0 && !window.currentActiveItem) window.selectChannel(channelsList[0]);
        }, (error) => console.error("Error al cargar canales: ", error));
    </script>

    <script>
        const videoElement = document.getElementById('live-player');
        const embedFrame = document.getElementById('embed-player');
        let hlsInstance = null;
        
        window.activeChannels = [];
        window.currentActiveItem = null;

        function detectarTipo(url) {
            if (!url) return 'desconocido';
            if (/<iframe/i.test(url)) return 'codigo_embed';
            if (/youtube\.com|youtu\.be/i.test(url)) return 'youtube';
            if (/\.m3u8|\.ts|\.mp4/i.test(url)) return 'video_nativo';
            return 'iframe_generico';
        }

        function normalizarEnlace(url) {
            if (!url) return url;
            if (url.includes('watch?v=')) {
                const id = url.split('v=')[1]?.split('&')[0];
                return `https://www.youtube.com/embed/${id}?autoplay=1`;
            }
            if (url.includes('youtu.be/')) {
                const id = url.split('youtu.be/')[1]?.split('?')[0];
                return `https://www.youtube.com/embed/${id}?autoplay=1`;
            }
            return url;
        }

        window.switchTab = function(tab) {
            document.getElementById('tab-movies').classList.toggle('active', tab === 'movies');
            document.getElementById('tab-premium').classList.toggle('active', tab === 'premium');
            document.getElementById('content-movies').classList.toggle('active', tab === 'movies');
            document.getElementById('content-premium').classList.toggle('active', tab === 'premium');
        }

        window.renderChannels = function() {
            const moviesContainer = document.getElementById('movies-container');
            const premiumContainer = document.getElementById('premium-container');
            moviesContainer.innerHTML = '';
            premiumContainer.innerHTML = '';

            if (window.activeChannels.length === 0) {
                moviesContainer.innerHTML = '<p style="padding:15px; font-size:13px; color:var(--text-muted); text-align:center;">No hay canales disponibles por el momento.</p>';
                premiumContainer.innerHTML = '<p style="padding:15px; font-size:13px; color:var(--text-muted); text-align:center;">No hay canales disponibles por el momento.</p>';
                return;
            }

            window.activeChannels.forEach(ch => {
                const card = document.createElement('div');
                const isActive = window.currentActiveItem && ch.id === window.currentActiveItem.id;
                card.className = `item-card ${isActive ? 'active' : ''}`;
                card.onclick = () => window.selectChannel(ch);

                const logoContent = ch.logo ? `<img src="${ch.logo}" class="channel-logo" loading="lazy">` : `<span style="font-size:11px; font-weight:700;">${(ch.name || '??').substring(0,2)}</span>`;
                const freeBadge = `<span class="free-badge">DISPONIBLE</span>`;

                card.innerHTML = `
                    <div class="channel-logo-wrapper">${logoContent}</div>
                    <div class="card-details">
                        <div class="channel-name">${ch.name || 'Canal sin nombre'}</div>
                        <div class="channel-category">${ch.subtitle || "Señal en vivo"}</div>
                    </div>
                    ${freeBadge}
                `;

                if (ch.type === 'movies') moviesContainer.appendChild(card);
                if (ch.type === 'premium') premiumContainer.appendChild(card);
            });
        }

        window.selectChannel = function(item) {
            window.currentActiveItem = item;
            window.renderChannels();
            document.getElementById('current-stream-title').innerText = item.name || 'Canal sin nombre';
            const streamUrl = (item.mirrors && item.mirrors[0]) ? item.mirrors[0] : '';

            if (!streamUrl) {
                alert("Este canal no tiene señal disponible en este momento.");
                return;
            }
            cargarContenido(streamUrl);
            resetMirrorButtons(item.mirrors ? item.mirrors.length : 0);
        }

        function cargarContenido(url) {
            videoElement.style.display = 'none';
            embedFrame.style.display = 'none';
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

            const tipo = detectarTipo(url);

            if (tipo === 'codigo_embed') {
                const srcMatch = url.match(/src="([^"]+)"/i);
                embedFrame.src = srcMatch ? srcMatch[1] : '';
                embedFrame.style.display = 'block';
                return;
            }

            if (tipo === 'youtube' || tipo === 'iframe_generico') {
                embedFrame.src = normalizarEnlace(url);
                embedFrame.style.display = 'block';
                return;
            }

            if (tipo === 'video_nativo') {
                videoElement.style.display = 'block';
                if (Hls.isSupported()) {
                    hlsInstance = new Hls({ maxMaxBufferLength: 10, liveSyncDurationCount: 3 });
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(videoElement);
                    
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        videoElement.play().catch(err => console.log("Se requiere interacción"));
                    });

                    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                        console.log("Error:", data.details);
                        if (data.fatal) {
                            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hlsInstance.startLoad();
                            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hlsInstance.recoverMediaError();
                        }
                    });
                } 
                else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                    videoElement.src = url;
                    videoElement.addEventListener('loadedmetadata', () => {
                        videoElement.play().catch(err => console.log("Se requiere interacción"));
                    });
                }
            }
        }

        window.changeMirror = function(idx) {
            const mirrorIndex = idx - 1;
            if (window.currentActiveItem?.mirrors?.[mirrorIndex]) {
                cargarContenido(window.currentActiveItem.mirrors[mirrorIndex]);
                document.getElementById('mirror-1').classList.toggle('active', idx === 1);
                document.getElementById('mirror-2').classList.toggle('active', idx === 2);
            }
        }

        function resetMirrorButtons(count) {
            document.getElementById('mirror-1').classList.add('active');
            document.getElementById('mirror-2').classList.remove('active');
            document.getElementById('mirror-2').style.display = count > 1 ? 'inline-block' : 'none';
        }

        window.switchView = function(type) {
            document.body.classList.toggle('view-tv-mode', type === 'tv');
            document.getElementById('btn-tv').classList.toggle('active', type === 'tv');
            document.getElementById('btn-mobile').classList.toggle('active', type === 'mobile');
        }
    </script>
</body>
</html>
